<!DOCTYPE html>

  <style>
    :root {

      --accent: #FF5252;
      --border: rgba(255, 255, 255, 0.1);

      border: 1px solid rgba(0, 229, 255, 0.25);

    p.desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-download {

      justify-content: center;

      background: linear-gradient(135deg, #00E5FF 0%, #2979FF 50%, #7C4DFF 100%);
      color: #0A0F1D;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.35);

    .btn-download:hover {

      border-top: 1px solid var(--border);
