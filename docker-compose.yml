services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: healthos_postgres
    restart: always
    environment:
      POSTGRES_USER: healthos_user
      POSTGRES_PASSWORD: healthos_dev_password
      POSTGRES_DB: healthos_db
    ports:
      - "5435:5432" # Non-conflicting host port 5435
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthos_user -d healthos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthos_redis
    restart: always
    ports:
      - "6380:6379" # Non-conflicting host port 6380
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthos_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://healthos_user:healthos_dev_password@db:5432/healthos_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - reportdata:/app/data/reports
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthos_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://healthos_user:healthos_dev_password@db:5432/healthos_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - reportdata:/app/data/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, redis.asyncio as aioredis; asyncio.run(aioredis.from_url('redis://redis:6379/0').ping())"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: ["arq", "app.workers.worker.WorkerSettings"]

volumes:
  pgdata:
  redisdata:
  reportdata:
