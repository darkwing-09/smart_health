services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: healthos_postgres
    restart: always
    environment:
      POSTGRES_USER: healthos_user
      POSTGRES_PASSWORD: healthos_dev_password
      POSTGRES_DB: healthos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-timescale.sql:/docker-entrypoint-initdb.d/init-timescale.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthos_user -d healthos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthos_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - reportdata:/app/data/reports
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthos_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - reportdata:/app/data/reports
    command: ["arq", "app.workers.worker.WorkerSettings"]

volumes:
  pgdata:
  redisdata:
  reportdata:
