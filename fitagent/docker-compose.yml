# FitAgent backend stack:  cp .env.example .env  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitagent
      POSTGRES_USER: fitagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitagent -d fitagent"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ${ENV_FILE:-.env}
    environment:
      FITAGENT_ENV: production
      DB_AUTO_CREATE: "false"
      DATABASE_URL: postgresql+asyncpg://fitagent:${POSTGRES_PASSWORD}@db:5432/fitagent
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - reports:/srv/backend/reports

  # Daily PDF report → WhatsApp (dry run into the `reports` volume until WHATSAPP_TOKEN is set).
  reports:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file: ${ENV_FILE:-.env}
    environment:
      FITAGENT_ENV: production
      DB_AUTO_CREATE: "false"
      DATABASE_URL: postgresql+asyncpg://fitagent:${POSTGRES_PASSWORD}@db:5432/fitagent
      REPORT_DIR: /srv/backend/reports
    command: ["python", "-m", "app.jobs.daily_reports", "--loop"]
    healthcheck:
      disable: true
    volumes:
      - reports:/srv/backend/reports

volumes:
  pgdata:
  reports:
