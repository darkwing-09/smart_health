name: FitAgent

on:
  push:
    paths: ["fitagent/**", ".github/workflows/fitagent.yml"]
  pull_request:
    paths: ["fitagent/**", ".github/workflows/fitagent.yml"]

defaults:
  run:
    working-directory: fitagent

jobs:
  python:
    name: Agents & backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - name: Agent tests
        run: uv run pytest agents -q
      - name: Readiness fixtures are current (Kotlin replays the same file)
        run: uv run python fixtures/generate_readiness_fixtures.py && git diff --exit-code fixtures/readiness_v2.json
      - name: Agent evals (deterministic baseline)
        working-directory: fitagent/agents
        run: uv run python -m evals.run_evals --offline
      - name: Backend tests
        working-directory: fitagent/backend
        run: uv run pytest -q
      - name: Migrations match models
        working-directory: fitagent/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitagent/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, screenshot regression, lint, build
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitagent-apk
          path: fitagent/app/build/outputs/apk/**/*.apk

  docker:
    name: API image + Postgres end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - name: Start Postgres + API (runs every Alembic migration)
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Smoke test (Phase 1 + Phase 2 flows)
        run: uv run --with httpx python backend/scripts/smoke_test.py http://localhost:8000
      - if: failure()
        run: docker compose logs api
