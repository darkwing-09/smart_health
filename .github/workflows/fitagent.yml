name: FitAgent

on:
  push:
    paths: ["fitagent/**", ".github/workflows/fitagent.yml"]
  pull_request:
    paths: ["fitagent/**", ".github/workflows/fitagent.yml"]

defaults:
  run:
    working-directory: fitagent

jobs:
  python:
    name: Agents & backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check agents backend
      - name: Agent tests
        run: uv run pytest agents -q
      - name: Agent evals (deterministic baseline)
        working-directory: fitagent/agents
        run: uv run python -m evals.run_evals --offline
      - name: Backend tests
        working-directory: fitagent/backend
        run: uv run pytest -q
      - name: Migrations match models
        working-directory: fitagent/backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: uv run alembic upgrade head && uv run alembic check

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitagent/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, screenshot regression, lint, build
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitagent-apk
          path: fitagent/app/build/outputs/apk/**/*.apk

  docker:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t fitagent-api:ci .
